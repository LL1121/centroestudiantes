# ============================================================================
# Producción — Centro de Estudiantes (Caddy + proxy_net)
#
# Requisitos:
#   - Red Docker externa: docker network create proxy_net
#   - Archivo .env en la raíz (ver .env.example)
#
# Levantar:
#   docker compose up -d --build
#
# Caddy (ejemplos de reverse_proxy por nombre de servicio):
#   biblioteca.tudominio → centro_estudiantes_biblioteca_web:3000
#   calendario.tudominio → centro_estudiantes_calendario_web:3000
#   votacion.tudominio   → centro_estudiantes_votacion_web:3000
#
# NO hay mapeo de puertos al host: solo tráfico vía proxy_net.
# ============================================================================

services:
  centro_estudiantes_db:
    image: pgvector/pgvector:pg16
    container_name: centro_estudiantes_db
    hostname: centro_estudiantes_db
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint-wrapper.sh"]
    command: ["postgres"]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-centro}
    volumes:
      - centro_estudiantes_pgdata:/var/lib/postgresql/data
      - ./docker/db/docker-entrypoint-wrapper.sh:/usr/local/bin/docker-entrypoint-wrapper.sh:ro
      - ./docker/db/sync-password.sh:/usr/local/bin/sync-password.sh:ro
    networks:
      - centro_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -q && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres -c 'SELECT 1' >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 30s

  centro_estudiantes_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: centro_estudiantes_api:latest
    container_name: centro_estudiantes_api
    hostname: centro_estudiantes_api
    restart: unless-stopped
    depends_on:
      centro_estudiantes_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"

      POSTGRES_HOST: centro_estudiantes_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-centro}

      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}

      CORS_ORIGINS: ${CORS_ORIGINS:?Definí CORS_ORIGINS en .env}

      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/var/storage

      EMBEDDING_DIM: "1536"
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      OCR_LANGS: ${OCR_LANGS:-spa+eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_MIN_NATIVE_CHARS: ${OCR_MIN_NATIVE_CHARS:-200}
      OCR_DPI: ${OCR_DPI:-200}
      FUZZY_THRESHOLD: ${FUZZY_THRESHOLD:-0.2}

      LLM_BACKEND: ${LLM_BACKEND:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-latest}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TOP_K: ${LLM_TOP_K:-5}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-30/day}
      CHAT_RELEVANCE_ENABLED: ${CHAT_RELEVANCE_ENABLED:-false}
      CHAT_RELEVANCE_MAX_DISTANCE: ${CHAT_RELEVANCE_MAX_DISTANCE:-0.75}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      MODERATION_MAX_PAGES: ${MODERATION_MAX_PAGES:-20}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Definí PUBLIC_APP_URL en .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REQUIRE_EMAIL_VERIFIED: ${REQUIRE_EMAIL_VERIFIED:-false}
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      COPYRIGHT_ENFORCEMENT_ENABLED: ${COPYRIGHT_ENFORCEMENT_ENABLED:-false}
    volumes:
      - centro_estudiantes_storage:/app/var/storage
    networks:
      - centro_internal
    # Sin `ports:` — solo red interna Docker

  centro_estudiantes_biblioteca_web:
    build:
      context: .
      dockerfile: apps/biblioteca/Dockerfile
      args:
        NEXT_PUBLIC_BIBLIOTECA_ONLY: "true"
        NEXT_PUBLIC_COPYRIGHT_ENABLED: ${NEXT_PUBLIC_COPYRIGHT_ENABLED:-false}
    image: centro_estudiantes_biblioteca_web:latest
    container_name: centro_estudiantes_biblioteca_web
    hostname: centro_estudiantes_biblioteca_web
    restart: unless-stopped
    depends_on:
      - centro_estudiantes_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_estudiantes_api:8000
      COPYRIGHT_ENABLED: ${COPYRIGHT_ENABLED:-false}
    networks:
      - centro_internal
      - proxy_net
    # Caddy: reverse_proxy centro_estudiantes_biblioteca_web:3000

  centro_estudiantes_calendario_web:
    build:
      context: .
      dockerfile: apps/calendario/Dockerfile
    image: centro_estudiantes_calendario_web:latest
    container_name: centro_estudiantes_calendario_web
    hostname: centro_estudiantes_calendario_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - proxy_net
    # Caddy: reverse_proxy centro_estudiantes_calendario_web:3000

  centro_estudiantes_votacion_web:
    build:
      context: .
      dockerfile: apps/votacion/Dockerfile
    image: centro_estudiantes_votacion_web:latest
    container_name: centro_estudiantes_votacion_web
    hostname: centro_estudiantes_votacion_web
    restart: unless-stopped
    depends_on:
      - centro_estudiantes_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_estudiantes_api:8000
    networks:
      - centro_internal
      - proxy_net
    # Caddy: reverse_proxy centro_estudiantes_votacion_web:3000

networks:
  proxy_net:
    external: true
  centro_internal:
    driver: bridge

volumes:
  centro_estudiantes_pgdata:
  centro_estudiantes_storage:
