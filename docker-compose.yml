# ============================================================================
# Producción — Centro de Estudiantes (Caddy + proxy_net)
#
# Cada app web es un servicio aislado en proxy_net (sin ports al host).
# Una sola Postgres + una sola API las comparten biblioteca y votación.
# Calendario y landing no necesitan DB.
#
# Requisitos:
#   docker network create proxy_net
#   cp .env.example .env  # completar
#
# Levantar:
#   docker compose up -d --build
#
# Caddy (reverse_proxy por container_name / servicio):
#   landing.tudominio     → centro_landing:3000
#   biblioteca.tudominio  → centro_biblioteca:3000
#   votacion.tudominio    → centro_votacion:3000
#   calendario.tudominio  → centro_calendario:3000
# ============================================================================

services:
  # ── Apps públicas (solo proxy_net, Caddy las alcanza) ─────────────────────

  centro_landing:
    build:
      context: .
      dockerfile: apps/centro/Dockerfile
    image: centro_landing:latest
    container_name: centro_landing
    hostname: centro_landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BIBLIOTECA_URL: ${NEXT_PUBLIC_BIBLIOTECA_URL:-https://biblioteca.tudominio.com}
    networks:
      - proxy_net

  centro_biblioteca:
    build:
      context: .
      dockerfile: apps/biblioteca/Dockerfile
      args:
        NEXT_PUBLIC_BIBLIOTECA_ONLY: "true"
        NEXT_PUBLIC_COPYRIGHT_ENABLED: ${NEXT_PUBLIC_COPYRIGHT_ENABLED:-false}
    image: centro_biblioteca:latest
    container_name: centro_biblioteca
    hostname: centro_biblioteca
    restart: unless-stopped
    depends_on:
      - centro_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_api:8000
      COPYRIGHT_ENABLED: ${COPYRIGHT_ENABLED:-false}
    networks:
      - proxy_net
      - centro_internal

  centro_votacion:
    build:
      context: .
      dockerfile: apps/votacion/Dockerfile
    image: centro_votacion:latest
    container_name: centro_votacion
    hostname: centro_votacion
    restart: unless-stopped
    depends_on:
      - centro_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_api:8000
    networks:
      - proxy_net
      - centro_internal

  centro_calendario:
    build:
      context: .
      dockerfile: apps/calendario/Dockerfile
    image: centro_calendario:latest
    container_name: centro_calendario
    hostname: centro_calendario
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - proxy_net

  # ── Infra compartida (NO va a Caddy; solo red interna) ────────────────────
  # Misma DB + misma API para biblioteca y votación (tablas profesores/votos
  # viven en el mismo Postgres que la biblioteca).

  centro_db:
    image: pgvector/pgvector:pg16
    container_name: centro_db
    hostname: centro_db
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/usr/local/bin/docker-entrypoint-wrapper.sh"]
    command: ["postgres"]
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-centro}
    volumes:
      - centro_pgdata:/var/lib/postgresql/data
      - ./docker/db/docker-entrypoint-wrapper.sh:/usr/local/bin/docker-entrypoint-wrapper.sh:ro
      - ./docker/db/sync-password.sh:/usr/local/bin/sync-password.sh:ro
    networks:
      - centro_internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -q && PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres -c 'SELECT 1' >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 15
      start_period: 30s

  centro_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: centro_api:latest
    container_name: centro_api
    hostname: centro_api
    restart: unless-stopped
    depends_on:
      centro_db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"

      POSTGRES_HOST: centro_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-centro}

      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}

      CORS_ORIGINS: ${CORS_ORIGINS:?Definí CORS_ORIGINS en .env}

      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/var/storage

      EMBEDDING_DIM: "1536"
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      OCR_LANGS: ${OCR_LANGS:-spa+eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_MIN_NATIVE_CHARS: ${OCR_MIN_NATIVE_CHARS:-200}
      OCR_DPI: ${OCR_DPI:-200}
      FUZZY_THRESHOLD: ${FUZZY_THRESHOLD:-0.2}

      LLM_BACKEND: ${LLM_BACKEND:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-latest}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TOP_K: ${LLM_TOP_K:-5}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-30/day}
      CHAT_RELEVANCE_ENABLED: ${CHAT_RELEVANCE_ENABLED:-false}
      CHAT_RELEVANCE_MAX_DISTANCE: ${CHAT_RELEVANCE_MAX_DISTANCE:-0.75}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      MODERATION_MAX_PAGES: ${MODERATION_MAX_PAGES:-20}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Definí PUBLIC_APP_URL en .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REQUIRE_EMAIL_VERIFIED: ${REQUIRE_EMAIL_VERIFIED:-false}
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      COPYRIGHT_ENFORCEMENT_ENABLED: ${COPYRIGHT_ENFORCEMENT_ENABLED:-false}
    volumes:
      - centro_storage:/app/var/storage
    networks:
      - centro_internal

networks:
  proxy_net:
    external: true
  centro_internal:
    driver: bridge

volumes:
  centro_pgdata:
  centro_storage:
