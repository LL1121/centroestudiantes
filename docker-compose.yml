# ============================================================================
# Producción — Centro de Estudiantes (Caddy + proxy_net + postgres_core)
#
# - Apps web aisladas en proxy_net (sin ports al host).
# - NO levanta Postgres propio: usa el contenedor central `postgres_core`.
# - biblioteca + votación → centro_api → postgres_core (misma DB dedicada).
#
# Requisitos:
#   - docker network create proxy_net
#   - postgres_core corriendo en proxy_net (imagen con pgvector)
#   - Ejecutar docker/db/init-postgres-core.sql una vez (ver comentarios del SQL)
#   - cp .env.example .env
#
# Levantar:
#   docker compose up -d --build
#
# Caddy:
#   landing     → centro_landing:3000
#   biblioteca  → centro_biblioteca:3000
#   votacion    → centro_votacion:3000
#   calendario  → centro_calendario:3000
# ============================================================================

services:
  centro_landing:
    build:
      context: .
      dockerfile: apps/centro/Dockerfile
    image: centro_landing:latest
    container_name: centro_landing
    hostname: centro_landing
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BIBLIOTECA_URL: ${NEXT_PUBLIC_BIBLIOTECA_URL}
    networks:
      - proxy_net

  centro_biblioteca:
    build:
      context: .
      dockerfile: apps/biblioteca/Dockerfile
      args:
        NEXT_PUBLIC_BIBLIOTECA_ONLY: "true"
        NEXT_PUBLIC_COPYRIGHT_ENABLED: ${NEXT_PUBLIC_COPYRIGHT_ENABLED:-false}
    image: centro_biblioteca:latest
    container_name: centro_biblioteca
    hostname: centro_biblioteca
    restart: unless-stopped
    depends_on:
      - centro_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_api:8000
      COPYRIGHT_ENABLED: ${COPYRIGHT_ENABLED:-false}
    networks:
      - proxy_net

  centro_votacion:
    build:
      context: .
      dockerfile: apps/votacion/Dockerfile
    image: centro_votacion:latest
    container_name: centro_votacion
    hostname: centro_votacion
    restart: unless-stopped
    depends_on:
      - centro_api
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://centro_api:8000
    networks:
      - proxy_net

  centro_calendario:
    build:
      context: .
      dockerfile: apps/calendario/Dockerfile
    image: centro_calendario:latest
    container_name: centro_calendario
    hostname: centro_calendario
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - proxy_net

  # API compartida (biblioteca + votación). Habla con postgres_core por proxy_net.
  centro_api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: centro_api:latest
    container_name: centro_api
    hostname: centro_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: ${DATABASE_URL}

      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}

      CORS_ORIGINS: ${CORS_ORIGINS:?Definí CORS_ORIGINS en .env}

      STORAGE_BACKEND: local
      STORAGE_ROOT: /app/var/storage

      EMBEDDING_DIM: "1536"
      EMBEDDING_BACKEND: ${EMBEDDING_BACKEND:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-200}
      OCR_LANGS: ${OCR_LANGS:-spa+eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-50}
      OCR_MIN_NATIVE_CHARS: ${OCR_MIN_NATIVE_CHARS:-200}
      OCR_DPI: ${OCR_DPI:-200}
      FUZZY_THRESHOLD: ${FUZZY_THRESHOLD:-0.2}

      LLM_BACKEND: ${LLM_BACKEND:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.5-flash-latest}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_TOP_K: ${LLM_TOP_K:-5}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-30/day}
      CHAT_RELEVANCE_ENABLED: ${CHAT_RELEVANCE_ENABLED:-false}
      CHAT_RELEVANCE_MAX_DISTANCE: ${CHAT_RELEVANCE_MAX_DISTANCE:-0.75}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      MODERATION_ENABLED: ${MODERATION_ENABLED:-true}
      MODERATION_MAX_PAGES: ${MODERATION_MAX_PAGES:-20}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Definí PUBLIC_APP_URL en .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      REQUIRE_EMAIL_VERIFIED: ${REQUIRE_EMAIL_VERIFIED:-false}
      ANTIVIRUS_ENABLED: ${ANTIVIRUS_ENABLED:-false}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-52428800}
      COPYRIGHT_ENFORCEMENT_ENABLED: ${COPYRIGHT_ENFORCEMENT_ENABLED:-false}
    volumes:
      - centro_storage:/app/var/storage
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true

volumes:
  centro_storage:
